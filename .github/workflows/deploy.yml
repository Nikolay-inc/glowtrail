name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Страховка: зависший шаг не должен держать деплой часами.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run verify
      - run: npm run sim-economy
      # Переводы и вёрстка на псевдо-языке (Playwright, Chromium).
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: npm run i18n-check
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i18n-screens
          path: artifacts/i18n
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          # Адрес для отзывов и контакта в политике конфиденциальности (секрет репозитория, в коде его нет).
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4